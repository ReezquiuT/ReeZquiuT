<svg viewBox="0 0 1000 170" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 1. TU NUEVA IMAGEN DE FONDO EN BASE64 -->
  <image width="1000" height="170" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64," />

  <!-- 2. Capa oscura para legibilidad -->
  <rect x="0" y="0" width="1000" height="170" fill="rgba(0, 0, 0, 0.35)" />

  <!-- 3. ESTILOS -->
  <style>
    .titulo { font: bold 20px 'Courier New', monospace; fill: #ffffff; text-anchor: middle; filter: drop-shadow(2px 2px 0px #000); }
    .subtitulo { font: bold 12px 'Courier New', monospace; fill: #ffaa00; text-anchor: middle; filter: drop-shadow(1px 1px 0px #000); }
    .caja { fill: rgba(35, 12, 12, 0.85); stroke: #ff5500; stroke-width: 2.5; }
    .texto-caja { font: bold 11px 'Courier New', monospace; fill: #ffffff; text-anchor: middle; }
    .skill-tag { font: bold 11px 'Courier New', monospace; fill: #ffff55; text-anchor: middle; filter: drop-shadow(1px 1px 0px #000); }
  </style>

  <!-- 4. TEXTOS Y CAJAS ENFRENTE -->
  <text x="500" y="30" class="titulo">🔥 INVENTARIO DE HERRAMIENTAS Y PROYECTOS 🔥</text>
  <text x="500" y="48" class="subtitulo">[ ReezquiuT | Desarrollador &amp; Creador de Mundos ]</text>

  <!-- Caja 1 -->
  <rect x="50" y="62" width="280" height="90" rx="4" class="caja" />
  <text x="190" y="86" class="subtitulo">🏡 BASE ACTUAL</text>
  <text x="190" y="112" class="texto-caja">Trabajando en:</text>
  <text x="190" y="134" class="skill-tag">[Nombre de tu Proyecto]</text>

  <!-- Caja 2 -->
  <rect x="360" y="62" width="280" height="90" rx="4" class="caja" />
  <text x="500" y="86" class="subtitulo">⚔️ MIS ARMAS (STACK)</text>
  <text x="500" y="112" class="skill-tag">JS • TS • React • Node</text>
  <text x="500" y="134" class="skill-tag">Python • Git • HTML/CSS</text>

  <!-- Caja 3 -->
  <rect x="670" y="62" width="280" height="90" rx="4" class="caja" />
  <text x="810" y="86" class="subtitulo">📚 ENCANTAMIENTOS</text>
  <text x="810" y="112" class="texto-caja">Aprendiendo ahora:</text>
  <text x="810" y="134" class="skill-tag">[Lo que estudias]</text>
</svg>
