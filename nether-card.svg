<svg viewBox="0 0 1000 240" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 1. TU IMAGEN DE FONDO LIMPIA DEL NETHER EN BASE64 -->
  <image width="1000" height="240" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64," />

  <!-- 2. Capa oscura semitransparente para que el inventario resalte bien -->
  <rect x="0" y="0" width="1000" height="240" fill="rgba(0, 0, 0, 0.45)" />

  <!-- 3. ESTILOS DE LA INTERFAZ -->
  <style>
    .mc-title { font: bold 13px 'Courier New', monospace; fill: #ffffff; text-anchor: middle; }
    .slot-bg { fill: #8b8b8b; stroke: #373737; stroke-width: 3; }
    .slot-highlight { fill: #8b8b8b; stroke: #fff; stroke-width: 3; }
  </style>

  <!-- 4. VENTANA DE INVENTARIO ESTILO MINECRAFT (CENTRADA) -->
  <!-- Fondo principal de la GUI (Gris clásico de inventario) -->
  <rect x="290" y="30" width="420" height="175" fill="#c6c6c6" stroke="#000000" stroke-width="4" />
  <!-- Bordes 3D interiores de la ventana -->
  <rect x="294" y="34" width="412" height="4" fill="#ffffff" />
  <rect x="294" y="34" width="4" height="167" fill="#ffffff" />
  <rect x="294" y="197" width="412" height="4" fill="#555555" />
  <rect x="702" y="34" width="4" height="167" fill="#555555" />

  <!-- Título del Inventario -->
  <text x="500" y="58" class="mc-title" fill="#3f3f3f">Inventario de Habilidades</text>

  <!-- ================= CASILLAS (SLOTS) ================= -->
  <!-- Slot 1: HTML -->
  <g transform="translate(330, 80)">
    <rect width="64" height="64" class="slot-bg" />
    <rect x="2" y="2" width="60" height="60" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2" />
    <image href="https://skillicons.dev/icons?i=html" x="12" y="12" width="40" height="40" />
  </g>

  <!-- Slot 2: CSS -->
  <g transform="translate(410, 80)">
    <rect width="64" height="64" class="slot-bg" />
    <rect x="2" y="2" width="60" height="60" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2" />
    <image href="https://skillicons.dev/icons?i=css" x="12" y="12" width="40" height="40" />
  </g>

  <!-- Slot 3: React -->
  <g transform="translate(490, 80)">
    <rect width="64" height="64" class="slot-bg" />
    <rect x="2" y="2" width="60" height="60" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2" />
    <image href="https://skillicons.dev/icons?i=react" x="12" y="12" width="40" height="40" />
  </g>

  <!-- Slot 4: Tailwind -->
  <g transform="translate(570, 80)">
    <rect width="64" height="64" class="slot-bg" />
    <rect x="2" y="2" width="60" height="60" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2" />
    <image href="https://skillicons.dev/icons?i=tailwind" x="12" y="12" width="40" height="40" />
  </g>

  <!-- Texto inferior decorativo estilo Minecraft -->
  <text x="500" y="172" class="mc-title" font-size="10" fill="#555555">ReezquiuT's Build</text>
</svg>
